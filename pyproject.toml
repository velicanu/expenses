[project]
name = "expenses"
version = "0.0.0"
description = "Expense tracking and visualization"
readme = "README.md"
dependencies = [
    "click",
    "ruff",
    "pandas",
    "plaid-python",
    "streamlit",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
    "plotly",
    "smart-open",
    "xlrd",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "src"
markers = [
    "fails_on_windows: does not run in windows (deselect with '-m \"not fails_on_windows\"')"
]

[tool.ruff]
src = ["src"]
extend-exclude = ["plaid/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "C901",  # too complex
]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends(...) / Query(...) / File(...) in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
